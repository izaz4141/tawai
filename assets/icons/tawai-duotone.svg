         cy="50"
         r="50"
         id="circle1" />
    </clipPath>
    <!-- Mask to create transparency -->
    <mask
       id="duoToneMask">
      <!-- White base (represents the opaque black background area) -->
      <circle
         cx="50"
         cy="50"
         r="50"
         fill="white"
         id="circle2" />
      <!-- Elements drawn in black here will become transparent holes -->
      <!-- Moon -->
      <path
         d="M 70 25 A 8 8 0 1 1 83 15 A 10 10 0 0 0 70 25 Z"
         fill="black"
         id="path2" />
      <!-- Snowflakes -->
      <g
         fill="black"
         id="g9">
        <circle
           cx="20"
           cy="15"
           r="1.2"
           id="circle3" />
        <circle
           cx="45"
           cy="10"
           r="1.5"
           id="circle4" />
        <circle
           cx="80"
           cy="30"
           r="1"
           id="circle5" />
        <circle
           cx="35"
           cy="35"
           r="1.2"
           id="circle6" />
        <circle
           cx="10"
           cy="40"
           r="1"
           id="circle7" />
        <circle
           cx="60"
           cy="25"
           r="1.5"
           id="circle8" />
        <circle
           cx="90"
           cy="45"
           r="1"
           id="circle9" />
      </g>
      <path
         d="M 25 22 L 25 28 M 22 25 L 28 25 M 22.8 22.8 L 27.2 27.2 M 22.8 27.2 L 27.2 22.8"
         fill="none"
         stroke="black"
         stroke-width="1"
         stroke-linecap="round"
         id="path9" />
      <path
         d="M 75 10 L 75 14 M 73 12 L 77 12 M 73.5 10.5 L 76.5 13.5 M 73.5 13.5 L 76.5 10.5"
         fill="none"
         stroke="black"
         stroke-width="1"
         stroke-linecap="round"
         id="path10" />
      <!-- Mountain Outlines -->
      <path
         d="M -10 65 Q 25 40 50 65 T 110 50"
         fill="none"
         stroke="black"
         stroke-width="1.5"
         stroke-linejoin="round"
         id="path11" />
      <!-- Bottom Mountain filled with black down to bottom edge to make area below transparent -->
      <path
         d="M -10 80 Q 30 55 55 85 T 110 70 L 110 110 L -10 110 Z"
         fill="black"
         stroke="black"
         stroke-width="1.5"
         stroke-linejoin="round"
         id="path12" />
      <!-- Earbud Cutouts (bores transparent holes through overlapping mountain/sky background) -->
      <g
         transform="translate(10, 88) rotate(55)"
         fill="black"
         id="maskEarbudLeft">
        <rect
           x="-4"
           y="-8"
           width="8"
           height="12"
           rx="4"
           id="rect1" />
        <circle
           cx="0"
           cy="-11"
           r="3"
           id="circle10" />
      </g>
      <g
         transform="translate(90, 88) rotate(-55)"
         fill="black"
         id="maskEarbudRight">
        <rect
           x="-4"
           y="-8"
           width="8"
           height="12"
           rx="4"
           id="rect10" />
        <circle
           cx="0"
           cy="-11"
           r="3"
           id="circle11" />
      </g>
      <!-- Tent (Filled with white to block transparent area behind it and remain solid black) -->
      <g
         transform="translate(50, 88) scale(1.5) translate(-50, -88)"
         id="g15">
        <path
           d="M 50 55 Q 40 85 28 88 L 72 88 Q 60 85 50 55 Z"
           fill="white"
           stroke="black"
           stroke-width="1.5"
           stroke-linejoin="round"
