     inkscape:deskcolor="#505050"
     inkscape:zoom="2.1213203"
     inkscape:cx="80.138769"
     inkscape:cy="21.448906"
     inkscape:window-width="1362"
     inkscape:window-height="718"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
