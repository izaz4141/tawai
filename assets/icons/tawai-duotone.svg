           fill="none"
           stroke="black"
           stroke-width="1.5"
           stroke-linejoin="round"
           id="path14" />
        <path
           d="M 50 65 L 46 88 L 54 88 Z"
           fill="none"
           stroke="black"
           stroke-width="1.5"
           stroke-linejoin="round"
           id="path15" />
      </g>
      <!-- Music Notes -->
      <g
         transform="translate(42, 35) scale(1.1)"
         id="g16">
        <line
           x1="3.5"
           y1="-2"
           x2="3.5"
           y2="10"
           stroke="black"
           stroke-width="1.5"
           stroke-linecap="round"
           id="line15" />
        <path
           d="M 3.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4"
           fill="none"
           stroke="black"
           stroke-width="1.5"
           stroke-linecap="round"
           id="path16" />
        <ellipse
           cx="0"
           cy="10"
           rx="3.5"
           ry="2.5"
           transform="rotate(-15 0 10)"
           fill="black"
           id="ellipse16" />
      </g>
      <g
