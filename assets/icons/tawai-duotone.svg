         id="g17">
        <line
           x1="3.5"
           y1="-2"
           x2="3.5"
           y2="10"
           stroke="black"
           stroke-width="1.5"
           stroke-linecap="round"
           id="line16" />
        <path
           d="M 3.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4"
           fill="none"
           stroke="black"
           stroke-width="1.5"
           stroke-linecap="round"
           id="path17" />
        <ellipse
           cx="0"
           cy="10"
           rx="3.5"
           ry="2.5"
           transform="rotate(-15 0 10)"
           fill="black"
           id="ellipse17" />
      </g>
    </mask>
  </defs>
  <!-- Apply Circular Clip and Mask to the Base Background -->
  <g
     clip-path="url(#circleClip)"
     id="g18">
    <circle
       cx="50"
       cy="50"
       r="50"
       fill="black"
       mask="url(#duoToneMask)"
       id="circle17"
       style="fill:#000000" />
  </g>
  <!-- Black Circular Outline for the Badge -->
  <circle
     cx="50"
     cy="50"
     r="50"
     fill="none"
     stroke="black"
     stroke-width="1.5"
     id="badgeOutline" />
  <!-- Earphones -->
  <g
     id="g21">
    <!-- Earphone Wire -->
    <path
       d="M 10 88 C 25 120, 75 120, 90 88"
       fill="none"
       stroke="black"
       stroke-width="1.5"
       stroke-linecap="round"
       id="path18" />
    <!-- Left Earbud -->
    <g
       transform="translate(10, 88) rotate(55)"
       id="g19">
      <!-- Earbud Body -->
      <rect
         x="-4"
         y="-8"
         width="8"
         height="12"
         rx="4"
         fill="none"
         stroke="black"
         stroke-width="1.5"
         id="rect18"
         style="fill:#000000" />
      <!-- Earbud Tip (Transparent) -->
      <circle
         cx="0"
         cy="-11"
         r="3"
         fill="none"
         stroke="black"
         stroke-width="1.5"
         id="circle19"
         style="fill:none" />
    </g>
    <!-- Right Earbud -->
    <g
       transform="translate(90, 88) rotate(-55)"
       id="g20">
      <!-- Earbud Body -->
      <rect
         x="-4"
         y="-8"
         width="8"
         height="12"
         rx="4"
         fill="none"
         stroke="black"
         stroke-width="1.5"
         id="rect19"
         style="fill:#000000" />
      <!-- Earbud Tip (Transparent) -->
      <circle
         cx="0"
         cy="-11"
         r="3"
         fill="none"
         stroke="black"
         stroke-width="1.5"
         id="circle20"
         style="fill:none" />
    </g>
  </g>
</svg>
