<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 120 125" width="100%" height="100%">
  <defs>
    <!-- Clip Path to keep the background perfectly rounded -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>

  <!-- Main Background Group with Circular Clipping Mask -->
  <g clip-path="url(#circleClip)">
    <!-- Base Background: Dark Solid Fill (Night Sky) -->
    <rect width="100" height="100" fill="#111111" />

    <!-- Crescent Moon (White filled accent) -->
    <path d="M 70 25 A 8 8 0 1 1 83 15 A 10 10 0 0 0 70 25 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Ambient Snowflakes (White dots) -->
    <g fill="#ffffff">
      <circle cx="20" cy="15" r="1.2" />
      <circle cx="45" cy="10" r="1.5" />
      <circle cx="80" cy="30" r="1" />
      <circle cx="35" cy="35" r="1.2" />
      <circle cx="10" cy="40" r="1" />
      <circle cx="60" cy="25" r="1.5" />
      <circle cx="90" cy="45" r="1" />
    </g>
    
    <!-- Detailed Snowflake 1 -->
    <path d="M 25 22 L 25 28 M 22 25 L 28 25 M 22.8 22.8 L 27.2 27.2 M 22.8 27.2 L 27.2 22.8" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
    <!-- Detailed Snowflake 2 -->
    <path d="M 75 10 L 75 14 M 73 12 L 77 12 M 73.5 10.5 L 76.5 13.5 M 73.5 13.5 L 76.5 10.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

    <!-- Back Mountains (Outline style with dark fill to blend into the night sky) -->
    <path d="M -10 65 Q 25 40 50 65 T 110 50 L 110 100 L -10 100 Z" fill="#111111" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Front Mountains (Solid white fill for crisp 2-tone foreground contrast) -->
    <path d="M -10 80 Q 30 55 55 85 T 110 70 L 110 100 L -10 100 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Enlarged Tent (Scaled up 1.5x from the bottom center) -->
    <g transform="translate(50, 88) scale(1.5) translate(-50, -88)">
      <!-- Outer Tent (Dark fill with white outline to pop against white mountain) -->
      <path d="M 50 55 Q 40 85 28 88 L 72 88 Q 60 85 50 55 Z" fill="#111111" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Flaps (Solid white accent for the tent door split) -->
      <path d="M 50 55 L 43 88 L 57 88 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Inner Door (Dark core) -->
      <path d="M 50 65 L 46 88 L 54 88 Z" fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Primary Music Note (White filled pop) -->
    <g transform="translate(42, 35) scale(1.1)">
      <line x1="3.5" y1="-2" x2="3.5" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 3.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <ellipse cx="0" cy="10" rx="3.5" ry="2.5" transform="rotate(-15 0 10)" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Secondary Music Note (White filled pop) -->
    <g transform="translate(26, 46) scale(0.7)">
      <line x1="3.5" y1="-2" x2="3.5" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 3.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <ellipse cx="0" cy="10" rx="3.5" ry="2.5" transform="rotate(-15 0 10)" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Solid Ring Border for the Background Canvas -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="#111111" stroke-width="3" />

  <!-- Earphones (Placed outside the clipping mask) -->
  <g>
    <!-- Earphone Wire -->
    <path d="M 10 88 C 25 120, 75 120, 90 88" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Earbud -->
    <g transform="translate(10, 88) rotate(55)">
      <circle cx="0" cy="-11" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
      <path d="M -2 -10 L 2 -10 L 2 -4 L -2 -4 Z" fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    </g>

    <!-- Right Earbud -->
    <g transform="translate(90, 88) rotate(-55)">
      <circle cx="0" cy="-11" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
      <path d="M -2 -10 L 2 -10 L 2 -4 L -2 -4 Z" fill="#111111" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    </g>
  </g>
</svg>
