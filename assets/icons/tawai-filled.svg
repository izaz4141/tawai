<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 120 125" width="100%" height="100%">
  <defs>
    <!-- Clip Path to keep the background perfectly rounded -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>

    <!-- Winter Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#1c2d5a" />
    </linearGradient>

    <!-- Snowy Mountain Gradients -->
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8da9c4" />
      <stop offset="100%" stop-color="#5c7a9c" />
    </linearGradient>
    <linearGradient id="mountFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2eafc" />
      <stop offset="100%" stop-color="#b6ccfe" />
    </linearGradient>

    <!-- Tent Gradient -->
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f" />
      <stop offset="100%" stop-color="#B8634D" />
    </linearGradient>

    <!-- Subtle Glow Effect for Music Notes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Background Group with Circular Clipping Mask -->
  <g clip-path="url(#circleClip)">
    <!-- Sky Background -->
    <rect width="100" height="100" fill="url(#skyGrad)" />

    <!-- Crescent Moon -->
    <path d="M 70 25 A 8 8 0 1 1 83 15 A 10 10 0 0 0 70 25 Z" fill="#F4D06F" opacity="0.9" />

    <!-- Ambient Snowflakes (Dots) -->
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="20" cy="15" r="1" />
      <circle cx="45" cy="10" r="1.5" opacity="0.5"/>
      <circle cx="80" cy="30" r="0.8" />
      <circle cx="35" cy="35" r="1.2" opacity="0.7"/>
      <circle cx="10" cy="40" r="1" />
      <circle cx="60" cy="25" r="1.5" opacity="0.6"/>
      <circle cx="90" cy="45" r="1" />
    </g>
    
    <!-- Detailed Snowflake 1 -->
    <path d="M 25 22 L 25 28 M 22 25 L 28 25 M 22.8 22.8 L 27.2 27.2 M 22.8 27.2 L 27.2 22.8" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>
    <!-- Detailed Snowflake 2 -->
    <path d="M 75 10 L 75 14 M 73 12 L 77 12 M 73.5 10.5 L 76.5 13.5 M 73.5 13.5 L 76.5 10.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>

    <!-- Back Mountains (Snowy & Rounded) -->
    <path d="M -10 65 Q 25 40 50 65 T 110 50 L 110 100 L -10 100 Z" fill="url(#mountBack)" />

    <!-- Front Mountains (Snowy & Rounded) -->
    <path d="M -10 80 Q 30 55 55 85 T 110 70 L 110 100 L -10 100 Z" fill="url(#mountFront)" opacity="0.95" />

    <!-- Enlarged Tent (Scaled up 1.5x from the bottom center) -->
    <g transform="translate(50, 88) scale(1.5) translate(-50, -88)">
      <path d="M 50 55 Q 40 85 28 88 L 72 88 Q 60 85 50 55 Z" fill="url(#tentGrad)" />
      <path d="M 50 55 L 43 88 L 57 88 Z" fill="#c06a4f" opacity="0.8" />
      <path d="M 50 65 L 46 88 L 54 88 Z" fill="#1c2d5a" opacity="0.7"/>
    </g>

    <!-- Primary Music Note (Warm Glow) -->
    <g transform="translate(42, 35) scale(1.1)" filter="url(#glow)">
      <ellipse cx="0" cy="10" rx="3.5" ry="2.5" transform="rotate(-15 0 10)" fill="#F4D06F" />
      <rect x="2.5" y="-2" width="2" height="12" rx="1" fill="#F4D06F" />
      <path d="M 4.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4" fill="none" stroke="#F4D06F" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Secondary Music Note -->
    <g transform="translate(26, 46) scale(0.7)" opacity="0.8">
      <ellipse cx="0" cy="10" rx="3.5" ry="2.5" transform="rotate(-15 0 10)" fill="#F4D06F" />
      <rect x="2.5" y="-2" width="2" height="12" rx="1" fill="#F4D06F" />
      <path d="M 4.5 -2 Q 10 -2 10 3 Q 9 7 4.5 4" fill="none" stroke="#F4D06F" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Earphones (Placed outside the clipping mask to allow overlap and hanging) -->
  <g>
    <!-- Earphone Wire (Sweeping through and dropping down) -->
    <path d="M 10 88 C 25 120, 75 120, 90 88" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

    <!-- Left Earbud -->
    <g transform="translate(10, 88) rotate(55)">
      <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#FFFFFF" />
      <path d="M -2 -10 L 2 -10 L 2 -8 L -2 -8 Z" fill="#c06a4f" />
      <circle cx="0" cy="-11" r="3" fill="#333333" />
    </g>

    <!-- Right Earbud -->
    <g transform="translate(90, 88) rotate(-55)">
      <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#FFFFFF" />
      <path d="M -2 -10 L 2 -10 L 2 -8 L -2 -8 Z" fill="#c06a4f" />
      <circle cx="0" cy="-11" r="3" fill="#333333" />
    </g>
  </g>
</svg>
