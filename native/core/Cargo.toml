[package]
name = "tawai-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
openssl = { version = "0.10.74", features = ["vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "stream", "gzip", "brotli", "deflate", "http2", "rustls-tls", "multipart", "blocking", "cookies"] }
uuid = { version = "1.18.0", features = ["v4"] }
time = { version = "0.3.41", features = ["macros", "formatting", "parsing", "local-offset"] }
futures = "0.3.31"
anyhow = "1.0.99"
serde_json = "1.0"
utoipa = { version = "5.4.0", features = ["macros"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "postgres", "migrate"] }
hex = "0.4.3"
percent-encoding = "2.3.2"
argon2 = { version = "0.5.3", features = ["alloc", "password-hash", "rand"] }
aes = "0.8.4"
aes-gcm-siv = "0.11.1"
fpe = "0.6.1"
sha2 = "0.11.0"
semver = "1.0.27"
lofty = "0.25.4"
image = "0.25.10"
symphonia = { version = "0.6.0", features = ["all"] }
walkdir = "2.5.0"
chromaprint-next = "0.1.0"
tempfile = "3.27.0"
uroman = "0.6.6"
wana_kana = "5.0.0"
lindera = { version = "4.0.1", features = ["embed-ipadic"] }
whatlang = "0.18.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["format", "codec"] }

[package.metadata.cargo-machete]
ignored = ["openssl", "chromaprint-next"]
