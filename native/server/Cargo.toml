[package]
name = "tawai-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tawai-server"
path = "src/main.rs"

[dependencies]
tawai-core = { path = "../core" }
axum = { version = "0.8.8", features = ["multipart"] }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
governor = "0.10.4"
tower-http = { version = "0.7.0", features = ["fs"] }
tower_governor = { version = "0.8.0", features = ["axum", "tracing"], default-features = false }
utoipa = { version = "5.4.0", features = ["macros", "axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
headers = "0.4.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.18.0", features = ["v4"] }
anyhow = "1.0.99"
futures = "0.3.31"
reqwest = { version = "0.12.23", features = ["json"] }
mime = "0.3.17"
subtle = "2.6.1"
time = "0.3.47"
